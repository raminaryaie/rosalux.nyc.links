<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosa Luxemburg Stiftung — New York Office</title>
<meta name="description" content="Links to our latest writing, events, and channels.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eeebe2;
    --ink: #1c1a17;
    --red: #d6402a;
    --yellow: #e8ae34;
    --white: #ffffff;
    --border-width: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    font-family: 'Archivo', sans-serif;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---- Masthead ---- */

  .masthead {
    background: var(--red);
    color: var(--white);
    padding: 2rem 1.5rem 1.75rem;
    text-align: center;
  }

  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 1rem;
  }

  .org-name {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    font-size: clamp(1.9rem, 8vw, 2.4rem);
    line-height: 1;
    margin: 0;
    text-transform: uppercase;
  }

  .org-subtitle {
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    margin: 0.4rem 0 0;
    opacity: 0.92;
  }

  .org-tagline {
    font-size: 0.9rem;
    line-height: 1.5;
    max-width: 32ch;
    margin: 0.9rem auto 0;
    opacity: 0.92;
  }

  /* ---- Standing links ---- */

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding: 1.5rem 1.5rem 0.5rem;
  }

  .link-button {
    display: block;
    text-align: center;
    text-decoration: none;
    color: var(--ink);
    background: var(--white);
    border: var(--border-width) solid var(--ink);
    padding: 0.85rem 1rem;
    font-weight: 700;
    font-size: 1rem;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .link-button:hover,
  .link-button:focus-visible {
    background: var(--ink);
    color: var(--paper);
  }

  .link-button:focus-visible {
    outline: 3px solid var(--yellow);
    outline-offset: 2px;
  }

  /* ---- Section label ---- */

  .section-label {
    padding: 1.75rem 1.5rem 0.75rem;
    font-weight: 700;
    font-size: 1.05rem;
  }

  /* ---- Grid ---- */

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    background: var(--ink);
    padding: 0 0 2px;
    flex: 1;
  }

  .tile {
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--paper);
  }

  .tile-image-wrap {
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--white);
    border-bottom: var(--border-width) solid var(--ink);
  }

  .tile-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .tile:hover .tile-image-wrap img,
  .tile:focus-visible .tile-image-wrap img {
    opacity: 0.85;
  }

  .tile:focus-visible {
    outline: 3px solid var(--yellow);
    outline-offset: -3px;
  }

  .tile-title {
    font-weight: 600;
    font-size: 0.85rem;
    line-height: 1.3;
    padding: 0.6rem 0.7rem 0.8rem;
    margin: 0;
  }

  /* ---- Empty state ---- */

  .empty-state {
    padding: 2.5rem 1.5rem;
    text-align: center;
  }

  .empty-state p {
    font-size: 0.95rem;
    line-height: 1.5;
    max-width: 30ch;
    margin: 0 auto;
  }

  /* ---- Footer ---- */

  footer {
    padding: 1.25rem 1.5rem 2rem;
    text-align: center;
    font-size: 0.75rem;
    color: var(--ink);
    opacity: 0.65;
  }

  footer a {
    color: inherit;
  }

  @media (prefers-reduced-motion: reduce) {
    .link-button,
    .tile-image-wrap img {
      transition: none;
    }
  }
</style>
</head>
<body>
<main>

  <header class="masthead">
    <svg class="mark" viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="28" cy="28" r="27" fill="none" stroke="#ffffff" stroke-width="2"/>
      <rect x="14" y="24" width="28" height="8" fill="#ffffff"/>
    </svg>
    <h1 class="org-name">Rosa Luxemburg<br>Stiftung</h1>
    <p class="org-subtitle">New York Office</p>
    <p class="org-tagline">Political education on the US, the UN, and global solidarity.</p>
  </header>

  <nav class="links" aria-label="Main links">
    <a class="link-button" href="https://rosalux.nyc" target="_blank" rel="noopener">Read our latest at rosalux.nyc</a>
    <a class="link-button" href="https://bsky.app/profile/rosaluxnyc.bsky.social" target="_blank" rel="noopener">Follow us on Bluesky</a>
    <!-- Add the Substack link here once it launches:
    <a class="link-button" href="https://rosaluxnyc.substack.com" target="_blank" rel="noopener">Subscribe on Substack</a>
    -->
  </nav>

  <h2 class="section-label">Latest</h2>

  <div id="grid" class="grid" role="list"></div>

  <footer>
    Updated automatically &middot; <a href="https://rosalux.nyc" target="_blank" rel="noopener">rosalux.nyc</a>
  </footer>

</main>

<script>
  async function loadGrid() {
    const grid = document.getElementById('grid');
    try {
      const response = await fetch('./linkinbio.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('linkinbio.json not found');
      const items = await response.json();

      if (!Array.isArray(items) || items.length === 0) {
        renderEmptyState(grid);
        return;
      }

      grid.innerHTML = items.map(item => `
        <a class="tile" role="listitem" href="${escapeAttr(item.url)}" target="_blank" rel="noopener">
          <div class="tile-image-wrap">
            <img src="${escapeAttr(item.image)}" alt="${escapeAttr(item.title)}" loading="lazy">
          </div>
          <p class="tile-title">${escapeHtml(item.title)}</p>
        </a>
      `).join('');
    } catch (err) {
      renderEmptyState(grid);
    }
  }

  function renderEmptyState(grid) {
    grid.outerHTML = `
      <div class="empty-state">
        <p>Nothing posted yet. Check back soon, or head to rosalux.nyc for everything we've published.</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return (str ?? '').replace(/"/g, '&quot;');
  }

  loadGrid();
</script>

</body>
</html>
