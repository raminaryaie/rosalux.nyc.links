<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosa Luxemburg Stiftung — New York Office</title>
<meta name="description" content="Links to our latest writing, events, and channels.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171313;
    --surface: #211c1c;
    --text: #e6e6e6;
    --text-dim: #9a9490;
    --red: #e0364f;
    --border: rgba(255,255,255,0.1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    padding: 2rem 1.25rem 2.5rem;
  }

  /* ---- Masthead ---- */

  .masthead {
    text-align: center;
    padding-bottom: 1.75rem;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border);
    margin: 0 auto 1.1rem;
    display: block;
  }

  .org-name {
    font-weight: 600;
    font-size: 1.3rem;
    letter-spacing: -0.01em;
    line-height: 1.25;
    margin: 0 0 0.6rem;
    color: var(--text);
  }

  .org-tagline {
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--text-dim);
    max-width: 36ch;
    margin: 0 auto 1.25rem;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 1.3rem;
  }

  .socials a {
    color: var(--text-dim);
    display: block;
    line-height: 0;
    transition: color 0.15s ease;
  }

  .socials a:hover, .socials a:focus-visible { color: var(--text); }

  .socials svg { width: 19px; height: 19px; }

  /* ---- Standing links ---- */

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding-bottom: 2rem;
  }

  .links-row {
    flex-direction: row;
    gap: 0.5rem;
  }

  .links-row .pill {
    flex: 1 1 0;
    padding: 0.6rem 0.4rem;
    font-size: 0.78rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pill {
    display: block;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.8rem 1.25rem;
    font-weight: 500;
    font-size: 0.88rem;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .pill:hover, .pill:focus-visible {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.28);
  }

  .pill:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* ---- Section label ---- */

  .section-label {
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.85rem;
    margin-bottom: 1rem;
  }

  /* ---- Cards ---- */

  #grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    container-type: inline-size;
    container-name: card-grid;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .card:hover .card-photo-wrap img,
  .card:focus-visible .card-photo-wrap img { transform: scale(1.04); }

  .card:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  .card-photo-wrap {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--surface);
  }

  .card-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }

  .card-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.7) 22%, rgba(0,0,0,0.12) 48%, rgba(0,0,0,0) 60%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(0.5rem, 2.4cqi, 0.7rem);
  }

  .card-date {
    display: inline-block;
    align-self: flex-start;
    background: rgba(0,0,0,0.55);
    font-size: clamp(0.6rem, 2.6cqi, 0.7rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    margin-bottom: 0.4rem;
  }

  .card-title {
    color: var(--text);
    font-weight: 600;
    line-height: 1.32;
    letter-spacing: -0.005em;
    margin: 0;
    font-size: clamp(0.82rem, 3.8cqi, 1rem);
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ---- Empty state ---- */

  .empty-state {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2.5rem 1.5rem;
    text-align: center;
  }

  .empty-state p {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text-dim);
    max-width: 30ch;
    margin: 0 auto;
  }

  /* ---- Footer ---- */

  footer {
    padding-top: 1.75rem;
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    .pill, .card-photo-wrap img, .socials a { transition: none; }
  }

  /* ---- Desktop: sidebar layout ---- */

  @media (min-width: 860px) {
    main {
      max-width: 1080px;
      padding: 3.5rem 2.5rem;
    }

    .layout {
      display: flex;
      align-items: flex-start;
      gap: 3.5rem;
    }

    .sidebar {
      flex: 0 0 300px;
      position: sticky;
      top: 3.5rem;
    }

    .content { flex: 1; min-width: 0; }

    .masthead { text-align: left; padding-bottom: 2rem; }
    .avatar { margin: 0 0 1.2rem; }
    .org-tagline { margin: 0 0 1.4rem; }
    .socials { justify-content: flex-start; }

    .links-row {
      flex-direction: column;
      padding-bottom: 0;
    }

    .links-row .pill {
      white-space: normal;
      text-align: left;
      padding: 0.75rem 1.1rem;
      font-size: 0.85rem;
    }

    #grid { grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  }
</style>
</head>
<body>

</main>

<script>
  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return '';
    return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function cardHTML(item, isEager) {
    return `
      <a class="card" href="${escapeAttr(item.url)}" target="_blank" rel="noopener">
        <div class="card-photo-wrap">
          <img src="${escapeAttr(item.image)}" alt="${escapeAttr(item.title)}" loading="${isEager ? 'eager' : 'lazy'}" decoding="async" onerror="this.remove()">
          <div class="card-scrim">
            <span class="card-date">${escapeHtml(formatDate(item.date))}</span>
            <p class="card-title">${escapeHtml(item.title)}</p>
          </div>
        </div>
      </a>
    `;
  }

  async function loadGrid() {
    const grid = document.getElementById('grid');
    try {
      const response = await fetch('./linkinbio.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('linkinbio.json not found');
      const items = await response.json();

      if (!Array.isArray(items) || items.length === 0) {
        renderEmptyState(grid);
        return;
      }

      grid.innerHTML = items.map((item, i) => cardHTML(item, i < 2)).join('');
    } catch (err) {
      renderEmptyState(grid);
    }
  }

  function renderEmptyState(grid) {
    grid.outerHTML = `
      <div class="empty-state" id="grid">
        <p>Nothing posted yet. Check back soon, or head to rosalux.nyc for everything we've published.</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return (str ?? '').replace(/"/g, '&quot;');
  }

  loadGrid();
</script>

</body>
</html>
