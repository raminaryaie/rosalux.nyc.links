<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosa Luxemburg Stiftung, New York Office</title>
<meta name="description" content="Links to our latest writing, events, and channels.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171313;
    --surface: #211c1c;
    --text: #e6e6e6;
    --text-dim: #9a9490;
    --red: #e0364f;
    --border: rgba(255,255,255,0.1);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    padding: 2rem 1.25rem 2.5rem;
  }

  /* ---- Masthead ---- */

  .masthead {
    text-align: center;
    padding-bottom: 1.75rem;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border);
    margin: 0 auto 1.1rem;
    display: block;
  }

  .org-name {
    font-weight: 600;
    font-size: 1.3rem;
    letter-spacing: -0.01em;
    line-height: 1.25;
    margin: 0 0 0.6rem;
    color: var(--text);
  }

  .org-tagline {
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--text-dim);
    max-width: 36ch;
    margin: 0 auto 1.25rem;
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 1.3rem;
  }

  .socials a {
    color: var(--text-dim);
    display: block;
    line-height: 0;
    transition: color 0.15s ease;
  }

  .socials a:hover, .socials a:focus-visible { color: var(--text); }

  .socials svg { width: 19px; height: 19px; }

  /* ---- Standing links ---- */

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding-bottom: 2rem;
  }

  .links-row {
    flex-direction: row;
    gap: 0.5rem;
  }

  .links-row .pill {
    flex: 1 1 0;
    padding: 0.6rem 0.4rem;
    font-size: 0.78rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pill {
    display: block;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.8rem 1.25rem;
    font-weight: 500;
    font-size: 0.88rem;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .pill:hover, .pill:focus-visible {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.28);
  }

  .pill:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* ---- Section label ---- */

  .section-label {
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.85rem;
    margin-bottom: 1rem;
  }

  /* ---- Cards ---- */

  #grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    container-type: inline-size;
    container-name: card-grid;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .card:hover .card-photo-wrap img,
  .card:focus-visible .card-photo-wrap img { transform: scale(1.04); }

  .card:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  .card-photo-wrap {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--surface);
  }

  .card-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }

  .card-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.7) 22%, rgba(0,0,0,0.12) 48%, rgba(0,0,0,0) 60%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: clamp(0.5rem, 2.4cqi, 0.7rem);
  }

  .card-date {
    display: inline-block;
    align-self: flex-start;
    background: rgba(0,0,0,0.55);
    font-size: clamp(0.6rem, 2.6cqi, 0.7rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    margin-bottom: 0.4rem;
  }

  .card-title {
    color: var(--text);
    font-weight: 600;
    line-height: 1.32;
    letter-spacing: -0.005em;
    margin: 0;
    font-size: clamp(0.82rem, 3.8cqi, 1rem);
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-text {
    padding: clamp(0.55rem, 2.6cqi, 0.75rem);
  }

  .card-text .card-date {
    background: none;
    padding: 0;
    margin: 0 0 0.3rem;
    color: var(--text-dim);
  }

  .card-text .card-title { text-shadow: none; }

  /* ---- Featured card ---- */

  #featured { margin-bottom: 2rem; }

  .featured-card {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 1rem;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    border-radius: 8px;
    padding: 0.9rem;
  }

  .featured-card.no-image { grid-template-columns: 1fr; }

  .featured-card img {
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 4px;
    display: block;
  }

  .featured-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 0.3rem;
  }

  .featured-title { font-weight: 600; font-size: 1rem; line-height: 1.3; margin: 0 0 0.3rem; }
  .featured-text { font-size: 0.85rem; line-height: 1.45; color: var(--text-dim); margin: 0 0 0.7rem; }

  .btn {
    display: inline-block;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.8rem;
    border-radius: 999px;
    padding: 0.45rem 0.95rem;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn:hover, .btn:focus-visible { border-color: rgba(255,255,255,0.4); }
  .btn-primary:hover, .btn-primary:focus-visible { background: #fff; }
  .btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* ---- Coming up ---- */

  #coming-up { margin-bottom: 2rem; scroll-margin-top: 1.5rem; }

  .events { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }

  .event {
    display: grid;
    grid-template-columns: 4.2rem 1fr;
    gap: 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.85rem 0.9rem;
  }

  .event-day { text-align: center; line-height: 1.1; padding-top: 0.1rem; }
  .event-month { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--red); }
  .event-date { font-size: 1.6rem; font-weight: 700; }
  .event-weekday { font-size: 0.7rem; color: var(--text-dim); }

  .event-title { font-weight: 600; font-size: 0.95rem; line-height: 1.3; margin: 0 0 0.25rem; }
  .event-meta { font-size: 0.8rem; line-height: 1.45; color: var(--text-dim); margin: 0 0 0.6rem; }
  .event-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }

  /* ---- Empty state ---- */

  .empty-state {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2.5rem 1.5rem;
    text-align: center;
  }

  .empty-state p {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text-dim);
    max-width: 30ch;
    margin: 0 auto;
  }

  /* ---- Footer ---- */

  footer {
    padding-top: 1.75rem;
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  footer a { color: inherit; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .pill, .card-photo-wrap img, .socials a { transition: none; }
    html { scroll-behavior: auto; }
  }

  /* ---- Desktop: sidebar layout ---- */

  @media (min-width: 860px) {
    main {
      max-width: 1080px;
      padding: 3.5rem 2.5rem;
    }

    .layout {
      display: flex;
      align-items: flex-start;
      gap: 3.5rem;
    }

    .sidebar {
      flex: 0 0 300px;
      position: sticky;
      top: 3.5rem;
    }

    .content { flex: 1; min-width: 0; }

    .masthead { text-align: left; padding-bottom: 2rem; }
    .avatar { margin: 0 0 1.2rem; }
    .org-tagline { margin: 0 0 1.4rem; }
    .socials { justify-content: flex-start; }

    .links-row {
      flex-direction: column;
      padding-bottom: 0;
    }

    .links-row .pill {
      flex: none;
      white-space: normal;
      text-align: left;
      padding: 0.75rem 1.1rem;
      font-size: 0.85rem;
    }

    #grid { grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  }
</style>
</head>
<body>

    <aside class="sidebar">

        <h1 class="org-name">Rosa Lux NYC</h1>

<script>
  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return '';
    return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function cardHTML(item, isEager) {
    return `
      <a class="card" href="${escapeAttr(item.url)}" target="_blank" rel="noopener">
        <div class="card-photo-wrap">
          <img src="${escapeAttr(item.image)}" alt="" loading="${isEager ? 'eager' : 'lazy'}" decoding="async" onerror="this.remove()">
        </div>
        <div class="card-text">
          <span class="card-date">${escapeHtml(formatDate(item.date))}</span>
          <p class="card-title">${escapeHtml(item.title)}</p>
        </div>
      </a>
    `;
  }

  async function loadGrid() {
    const grid = document.getElementById('grid');
    try {
      const response = await fetch('./linkinbio.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('linkinbio.json not found');
      const items = await response.json();

      if (!Array.isArray(items) || items.length === 0) {
        renderEmptyState(grid);
        return;
      }

      grid.innerHTML = items.map((item, i) => cardHTML(item, i < 2)).join('');
    } catch (err) {
      renderEmptyState(grid);
    }
  }

  function renderEmptyState(grid) {
    grid.outerHTML = `
      <div class="empty-state" id="grid">
        <p>Nothing posted yet. Check back soon, or head to rosalux.nyc for everything we've published.</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return (str ?? '').replace(/"/g, '&quot;');
  }

  // ---- Featured: one thing we're pushing, with its own button and an end date (featured.json) ----

  function todayET() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
  }

  async function loadFeatured() {
    const box = document.getElementById('featured');
    try {
      const r = await fetch('./featured.json', { cache: 'no-store' });
      if (!r.ok) return;
      const items = (await r.json()).filter(i => i && i.url && (!i.until || i.until >= todayET()));
      if (!items.length) return;
      const i = items[0];
      box.innerHTML = `
        <div class="featured-card${i.image ? '' : ' no-image'}">
          ${i.image ? `<img src="${escapeAttr(i.image)}" alt="" loading="eager" onerror="this.remove()">` : ''}
          <div>
            <p class="featured-label">${escapeHtml(i.label || 'Featured')}</p>
            <p class="featured-title">${escapeHtml(i.title)}</p>
            ${i.text ? `<p class="featured-text">${escapeHtml(i.text)}</p>` : ''}
            <a class="btn btn-primary" href="${escapeAttr(i.url)}" target="_blank" rel="noopener">${escapeHtml(i.button || 'Find out more')}</a>
          </div>
        </div>`;
      box.hidden = false;
    } catch (e) { /* no Featured card */ }
  }

  // ---- Coming up: live from rosalux.nyc's event API, plus our own list (events.json) ----

  const RSVP_PATTERN = /eventbrite\.|zoom\.us\/(webinar|meeting)\/register|forms\.gle|docs\.google\.com\/forms|lu\.ma\/|bit\.ly\/|actionnetwork\.org|mobilize\.us|tickets|regist|rsvp/i;

  function decodeEntities(str) {
    const t = document.createElement('textarea');
    t.innerHTML = str || '';
    return t.value;
  }

  function firstRsvpLink(html) {
    const links = [...(html || '').matchAll(/href="([^"]+)"/g)].map(m => m[1]);
    return links.find(l => RSVP_PATTERN.test(l) && !/rosalux\.nyc\/wp-content/.test(l)) || '';
  }

  function fromWebsite(e) {
    const a = e.acf || {};
    const start = (a.start_date_time || '').replace(' ', 'T').slice(0, 16);
    return {
      title: decodeEntities(e.title && e.title.rendered),
      start,
      place: a.location || '',
      rsvp: firstRsvpLink(e.content && e.content.rendered),
      info: e.link || '',
    };
  }

  function sameEvent(a, b) {
    const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    return a.start.slice(0, 10) === b.start.slice(0, 10) &&
      (norm(a.title).includes(norm(b.title)) || norm(b.title).includes(norm(a.title)));
  }

  function eventParts(start) {
    const [d, t] = start.split('T');
    const date = new Date(d + 'T12:00:00');
    const month = date.toLocaleDateString('en-US', { month: 'short' });
    const day = date.getDate();
    const weekday = date.toLocaleDateString('en-US', { weekday: 'short' });
    let time = '';
    if (t && t !== '00:00') {
      const [h, m] = t.split(':').map(Number);
      const h12 = ((h + 11) % 12) + 1;
      time = `${h12}${m ? ':' + String(m).padStart(2, '0') : ''} ${h < 12 ? 'am' : 'pm'} ET`;
    }
    return { month, day, weekday, time };
  }

  function eventHTML(e) {
    const p = eventParts(e.start);
    const meta = [p.time, e.place, e.with].filter(Boolean).map(escapeHtml).join(' · ');
    const actions = [
      e.rsvp ? `<a class="btn btn-primary" href="${escapeAttr(e.rsvp)}" target="_blank" rel="noopener">RSVP</a>` : '',
      e.info ? `<a class="btn" href="${escapeAttr(e.info)}" target="_blank" rel="noopener">More info</a>` : '',
    ].join('');
    return `
      <li class="event">
        <div class="event-day" aria-hidden="true">
          <div class="event-month">${escapeHtml(p.month)}</div>
          <div class="event-date">${p.day}</div>
          <div class="event-weekday">${escapeHtml(p.weekday)}</div>
        </div>
        <div>
          <p class="event-title">${escapeHtml(e.title)}</p>
          <p class="event-meta"><span class="visually-hidden">${escapeHtml(p.weekday + ' ' + p.month + ' ' + p.day)} · </span>${meta}</p>
          ${actions ? `<div class="event-actions">${actions}</div>` : ''}
        </div>
      </li>`;
  }

  async function loadEvents() {
    const section = document.getElementById('coming-up');
    const pill = document.getElementById('events-pill');
    const today = todayET();
    let ours = [], site = [];
    try {
      const r = await fetch('./events.json', { cache: 'no-store' });
      if (r.ok) ours = await r.json();
    } catch (e) {}
    try {
      const r = await fetch('https://rosalux.nyc/wp-json/wp/v2/event?per_page=20&_fields=title,link,acf,content', { cache: 'no-store' });
      if (r.ok) site = (await r.json()).map(fromWebsite);
    } catch (e) {}
    const merged = [...ours];
    for (const e of site) if (!merged.some(o => sameEvent(o, e))) merged.push(e);
    const upcoming = merged
      .filter(e => e && e.title && e.start && e.start.slice(0, 10) >= today)
      .sort((a, b) => a.start.localeCompare(b.start));
    if (!upcoming.length) {
      pill.href = 'https://rosalux.nyc/events/';
      pill.target = '_blank';
      pill.rel = 'noopener';
      return;
    }
    document.getElementById('events').innerHTML = upcoming.map(eventHTML).join('');
    section.hidden = false;
  }

  loadFeatured();
  loadEvents();
  loadGrid();
</script>

</body>
</html>
